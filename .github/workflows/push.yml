name: Builder

on: ["push", "pull_request", "workflow_dispatch"]

permissions:
  contents: read

jobs:
  build:
    name: Build SDH-CSSLoader for Decky
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Set up NodeJS 22
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 22
  
    - name: Install JS dependencies
      run: |
        npm i -g pnpm@10.33.0
        pnpm install --frozen-lockfile
      
    - name: Build Frontend
      run: |
        pnpm run build

    - name: Set up Rust for static Linux builds
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools
        rustup target add x86_64-unknown-linux-musl
        rustup component add clippy rustfmt

    - name: Check Backend
      run: |
        cargo fmt --check --manifest-path backend/Cargo.toml
        cargo clippy --locked --all-targets --manifest-path backend/Cargo.toml -- -D warnings
        cargo test --locked --manifest-path backend/Cargo.toml

    - name: Build Backend
      run: cargo build --release --locked --target x86_64-unknown-linux-musl --manifest-path backend/Cargo.toml

    - name: Package Release
      run: |
        version=$(node -p "require('./package.json').version")
        if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
          echo "Release tag must match package.json version v$version" >&2
          exit 1
        fi
        mkdir -p upload/SDH-CssLoader/bin
        cp *.json LICENSE README.md upload/SDH-CssLoader/
        cp -r dist upload/SDH-CssLoader/
        cp backend/target/x86_64-unknown-linux-musl/release/backend upload/SDH-CssLoader/bin/backend
        cd upload
        zip -qr "../SDH-CssLoader-$version.zip" SDH-CssLoader

    - name: Upload package artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: SDH-CSSLoader-Decky
        path: SDH-CssLoader-*.zip
        if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout release tag
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Download release assets
      uses: actions/download-artifact@v8.0.2
      with:
        path: release-assets
        merge-multiple: true

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        git for-each-ref --format='%(contents)' "$GITHUB_REF" > release-notes.md
        gh release create "$GITHUB_REF_NAME" release-assets/* \
          --verify-tag --title "CSS Loader $GITHUB_REF_NAME" \
          --notes-file release-notes.md
