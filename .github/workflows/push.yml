name: Builder

on: ["push", "pull_request", "workflow_dispatch"]

permissions:
  contents: read

jobs:
  build:
    name: Build SDH-CSSLoader for Decky
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Set up NodeJS 22
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 22
  
    - name: Install JS dependencies
      run: |
        npm i -g pnpm@8.15.9
        pnpm install --frozen-lockfile
      
    - name: Build Frontend
      run: |
        pnpm run build
      
    - name: Package Release
      run: |
        version=$(node -p "require('./package.json').version")
        if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
          echo "Release tag must match package.json version v$version" >&2
          exit 1
        fi
        mkdir -p upload/SDH-CssLoader
        cp *.py *.json LICENSE README.md upload/SDH-CssLoader/
        cp -r dist upload/SDH-CssLoader/
        cd upload
        zip -qr "../SDH-CssLoader-$version.zip" SDH-CssLoader

    - name: Upload package artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: SDH-CSSLoader-Decky
        path: SDH-CssLoader-*.zip
        if-no-files-found: error
  
  build-standalone-win:
    name: Build SDH-CSSLoader Standalone for Windows
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Set up Python 3.10.2
      uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.10.2"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller==5.5
        pip install -r requirements.txt

    - name: Build Python Backend
      run: pyinstaller --noconfirm --onefile --add-data "./assets;/assets" --name "CssLoader-Standalone" ./main.py ./css_win_tray.py

    - name: Build Python Backend Headless
      run: pyinstaller --noconfirm --noconsole --onefile --add-data "./assets;/assets" --name "CssLoader-Standalone-Headless" ./main.py ./css_win_tray.py

    - name: Upload package artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: SDH-CSSLoader-Win-Standalone
        path: |
          ./dist/CssLoader-Standalone.exe
          ./dist/CssLoader-Standalone-Headless.exe
        if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-standalone-win]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout release tag
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Download release assets
      uses: actions/download-artifact@v8.0.2
      with:
        path: release-assets
        merge-multiple: true

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        git for-each-ref --format='%(contents)' "$GITHUB_REF" > release-notes.md
        gh release create "$GITHUB_REF_NAME" release-assets/* \
          --verify-tag --title "CSS Loader $GITHUB_REF_NAME" \
          --notes-file release-notes.md
