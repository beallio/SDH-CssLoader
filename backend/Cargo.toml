[package]
name = "css-loader-backend"
version = "2.1.4-rust.1-rc.3"
edition = "2024"
publish = false

[[bin]]
name = "backend"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
decky-plugin = { git = "https://github.com/beallio/decky-loader", package = "decky-plugin" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
indexmap = "2"
log = "0.4"
notify = "8"
regex = "1"
fancy-regex = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "multipart", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
